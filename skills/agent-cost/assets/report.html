* { box-sizing: border-box; }

  width: 100%; height: 34px; padding: 0 10px 0 32px;

  color: var(--text); font: inherit;

.search::placeholder { color: var(--faint); }
.side-head { display: flex; flex-direction: column; gap: 8px; flex: none; max-height: 52%; overflow-y: auto; }

.side-count { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-left: auto; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; background: var(--m-other); }

.f-opus { --c: var(--m-opus); }

.f-haiku { --c: var(--m-haiku); }
.f-fable { --c: var(--m-fable); }

.tl-scroll { overflow-x: auto; overscroll-behavior-x: contain; }
.tl { --lw: 250px; --cw: 76px; position: relative; min-width: 720px; padding-bottom: 6px; }

.tl-axis { height: 30px; border-bottom: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }
.tl-axis .tl-ticks { position: relative; height: 100%; }

.tick.now { color: var(--ok); font-weight: 650; }
.tl-axis .sticky-col, .tl-label { position: sticky; left: 0; z-index: 2; background: var(--surface); }
.tl-axis .sticky-col { height: 100%; display: flex; align-items: center; padding-left: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.tl-axis .num { padding-right: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.tl-grid { position: absolute; top: 30px; bottom: 0; left: var(--lw); right: var(--cw); pointer-events: none; }
.tl-grid i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--grid); }

.tl-row {
  width: 100%; min-height: 40px; padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer;
  border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
}
.tl-row:hover, .tl-row:hover .tl-label { background: var(--surface-2); }
.tl-row.sel, .tl-row.sel .tl-label { background: var(--sel); }
.tl-row.sel .tl-label { box-shadow: inset 3px 0 0 var(--accent); }
.tl-row:focus-visible { outline-offset: -2px; }
.tl-label { display: flex; align-items: center; gap: 6px; min-width: 0; height: 100%; padding: 6px 8px 6px calc(16px + var(--d, 0) * 18px); }
.tl-elbow { width: 10px; height: 14px; flex: none; margin-top: -10px; border-left: 1.5px solid var(--border-strong); border-bottom: 1.5px solid var(--border-strong); border-bottom-left-radius: 4px; }
.tl-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }

.tl-meta { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pur { font-size: 10.5px; font-weight: 550; color: var(--accent); background: var(--surface-2); border-radius: 4px; padding: 0 5px; line-height: 15px; white-space: nowrap; }
.side-foot { padding: 7px 14px; border-top: 1px solid var(--border); font-size: 11.5px; }

.tl-track { position: relative; height: 40px; }
.tl-bar {
  position: absolute; top: 12px; height: 16px; min-width: 3px; border-radius: 4px;
  background: var(--c);
}
.tl-row.builtin .tl-bar {
  top: 14px; height: 12px;
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 55%, transparent) 0 3px, color-mix(in srgb, var(--c) 22%, transparent) 3px 6px);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 70%, transparent);
}
.tl-bar.live::after {
  content: ""; position: absolute; right: -1px; top: -3px; bottom: -3px; width: 3px; border-radius: 2px;
  background: var(--ok); animation: blink 1.6s ease-in-out infinite;
}
@keyframes blink { 50% { opacity: .25; } }
.tl-cost { padding-right: 16px; text-align: right; font-weight: 600; font-size: 13px; white-space: nowrap; }
.tl-row.builtin .tl-cost { font-weight: 450; color: var(--muted); font-style: italic; }
.tl-foot { padding: 10px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }

.detail-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 14px 16px 0; }

.share { display: flex; align-items: center; gap: 8px; }
.share-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; min-width: 40px; }
.share-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.excerpts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 16px 14px; }
.excerpt { border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); min-width: 0; }
.excerpt-k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; color: var(--muted); padding: 8px 12px 0; }
.excerpt-v { margin: 0; padding: 6px 12px 10px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; max-height: 220px; overflow-y: auto; }
.excerpt-v.none { color: var(--faint); font-style: italic; }
.note { padding: 0 16px 12px; font-size: 12.5px; color: var(--muted); }

.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }
.tbl th, .tbl td { padding: 7px 10px; border-bottom: 1px solid var(--border); }
.tbl th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; text-align: right; white-space: nowrap; background: var(--surface-2); }

.mname { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-weight: 550; }

.stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-3); gap: 2px; }
.stack i { display: block; height: 100%; background: var(--c); min-width: 2px; }
.mlegend { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 16px; margin-top: 12px; }

      var cls = "b" + (d.c > 0 ? " has" : "") + (k === dayKey(NOW) ? " today" : "") + (k === curKey ? " cur" : "");
      var label = dfmt.format(d.t) + ": " + usd(d.c) + " · " + d.n + (d.n === 1 ? " session" : " sessions");
      return '<span class="' + cls + '" data-tip="' + esc(label) + '" title="' + esc(label) + '"><i style="height:' + (d.c / max * 100).toFixed(1) + '%"></i></span>';
    }).join("");
    function tile(k, v) {
      return '<div class="tile"><div class="tile-k">' + k + '</div><div class="tile-v">' + usd(v[0]) + '</div><div class="tile-s">' + v[1] + (v[1] === 1 ? " session" : " sessions") + '</div></div>';
    }
    return '<section class="card" id="period" aria-labelledby="pTitle"><div class="card-head"><h2 class="card-title" id="pTitle">Spend over time</h2>' +
      (fnote ? '<span class="card-sub">' + esc(fnote) + '</span>' : "") +
      '<div class="seg" role="group" aria-label="Scope"><button type="button" data-scope="all" aria-pressed="' + (state.scope === "all") + '">All projects</button>' +
      '<button type="button" data-scope="project" aria-pressed="' + (state.scope === "project") + '" title="' + esc(tgt.title) + '">' + esc(tgt.label) + '</button></div></div>' +
      '<div class="card-body"><div class="ptiles">' + tile("Today", d1) + tile("7 days", d7) + tile("30 days", d30) + '</div>' +
      '<div class="bars" id="bars" role="img" aria-label="Daily spend for the last 30 days, max ' + esc(usd(max)) + '">' + bars + '<span class="bars-max">' + usd(max) + '</span></div>' +
      '<div class="bars-x"><span>' + esc(dfmt.format(days[0].t)) + '</span><span>' + esc(dfmt.format(days[15].t)) + '</span><span>Today</span></div>' +
      '<div class="bars-tip" id="barsTip">Hover a bar for the day’s total. Highlighted: this session’s day.</div></div></section>';
  }

  function renderHeader(r) {
    var span = (r.end - r.start) / 1000;
    var endLbl = r.state === "live" ? "now" : (dayKey(r.end) !== dayKey(r.start) ? dtfmt.format(r.end) : hm(r.end));
    var stateTitle = r.state === "idle" ? "No activity since " + hm(ms(r.main.last_activity_at)) : r.state;
    return '<section class="card shead" aria-labelledby="sTitle"><div class="shead-top"><h1 id="sTitle">' + esc(r.title) + '</h1>' +
      '<span class="badge ' + esc(r.state) + '" title="' + esc(stateTitle) + '">' + (r.state === "live" ? '<span class="dot live"></span>' : "") + esc(r.state) + '</span></div>' +
      '<div class="meta-row"><span title="' + esc(r.cwd) + '">' + ICON.folder + esc(shortPath(r.cwd)) + '</span>' +
      '<span>' + ICON.clock + esc(relDay(r.start) + " " + hm(r.start)) + ' → ' + esc(endLbl) + '</span>' +
      '<span class="mono" title="' + esc(r.id) + '">' + ICON.hash + esc(r.id) + '</span></div>' +
      '<div class="tiles">' +
      '<div class="tile primary"><div class="tile-k">Total</div><div class="tile-v">' + usd(r.total) + '</div><div class="tile-s">' + r.sessions.length + (r.sessions.length === 1 ? " session" : " sessions") + (r.builtins ? " · " + r.builtins + " built-in" : "") + '</div></div>' +
      '<div class="tile"><div class="tile-k">Main</div><div class="tile-v">' + usd(r.own) + '</div><div class="tile-s">' + esc(modelShort(r.main.model)) + (r.main.effort ? " · " + esc(r.main.effort) : "") + '</div></div>' +
      '<div class="tile"><div class="tile-k">Agents</div><div class="tile-v">' + usd(r.agents) + '</div><div class="tile-s">' + r.herdr + ' herdr' + (r.hkids ? " · " + r.hkids + " headless" : "") + (r.total > 0 ? " · " + (r.agents / r.total * 100).toFixed(0) + "% of total" : "") + '</div></div>' +
      '<div class="tile"><div class="tile-k">Time</div><div class="tile-v">' + dur(span) + '</div><div class="tile-s">' + esc(hm(r.start)) + ' → ' + esc(r.state === "live" ? "now" : hm(r.end)) + '</div></div>' +
      '</div></section>';
  }

  var currentRows = [];
  function render() {
    var r = state.root;
    currentRows = rowsFor(r);
    if (!currentRows.some(function (x) { return x.key === state.sel; })) state.sel = currentRows[0].key;
    main.innerHTML = renderHeader(r) + renderTimeline(r, currentRows) + renderDetail(r, currentRows) +
      '<div class="grid2">' + renderModels(r) + renderPeriod(r) + '</div>';
    document.title = "Agent Cost · " + r.title;
    renderList();
  }

  function selectRow(key, focus) {
    state.sel = key;
    var tl = document.getElementById("tl");
    tl.querySelectorAll(".tl-row").forEach(function (b) {
      var on = b.getAttribute("data-key") === key;
      b.classList.toggle("sel", on);
      b.setAttribute("aria-pressed", String(on));
      if (on && focus) b.focus();
    });
    var old = document.getElementById("detail");
    var tmp = document.createElement("div");
    tmp.innerHTML = renderDetail(state.root, currentRows);
    old.replaceWith(tmp.firstChild);
  }

  main.addEventListener("click", function (e) {
    var row = e.target.closest(".tl-row");
    if (row) { selectRow(row.getAttribute("data-key")); return; }
    var sc = e.target.closest("[data-scope]");
    if (sc) { state.scope = sc.getAttribute("data-scope"); refreshPeriod(); }
  });
  main.addEventListener("keydown", function (e) {
    var row = e.target.closest && e.target.closest(".tl-row");
    if (!row || (e.key !== "ArrowDown" && e.key !== "ArrowUp")) return;
    e.preventDefault();
    var i = +row.getAttribute("data-idx") + (e.key === "ArrowDown" ? 1 : -1);
    if (i >= 0 && i < currentRows.length) selectRow(currentRows[i].key, true);
  });
  main.addEventListener("mouseover", function (e) {
    var b = e.target.closest && e.target.closest(".bars .b");
    var tip = document.getElementById("barsTip");
    if (b && tip) tip.textContent = b.getAttribute("data-tip");
  });

  function route() {
    var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    var r = byRoot[h] || bySession[h] || byRoot[focusId] || roots[0];
    if (!r) return;
    var changed = state.root !== r;
    state.root = r;
    if (changed) {
      openMap["r:" + r.cl.rkey] = true;
      openMap["p:" + r.cl.pkey] = true;
      saveOpen();
    }
    if (bySession[h] && !byRoot[h]) state.sel = "s:" + h;
    else if (changed) state.sel = null;
    render();
    if (changed) window.scrollTo(0, 0);
    closeNav();
  }

  function closeNav() {
    document.body.classList.remove("nav-open");
    document.getElementById("navToggle").setAttribute("aria-expanded", "false");
  }
  document.getElementById("navToggle").addEventListener("click", function () {
    var open = !document.body.classList.contains("nav-open");
    document.body.classList.toggle("nav-open", open);
    this.setAttribute("aria-expanded", String(open));
    if (open) filterEl.focus();
  });
  document.getElementById("backdrop").addEventListener("click", closeNav);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeNav(); });
  slist.addEventListener("click", function (e) {
    var h = e.target.closest(".ag-head");
    if (h) { toggleAg(h); if (!querying()) saveOpen(); return; }
    if (e.target.closest("[data-clear]")) { clearFilters(); return; }
    var a = e.target.closest("a.sitem");
    if (a && a.getAttribute("href") === location.hash) closeNav();
  });
  filterEl.addEventListener("input", function () {
    var was = querying();
    state.filter = filterEl.value;
    if (was !== querying()) qOpen = {};
    filtersChanged();
  });
  document.getElementById("stateSeg").addEventListener("click", function (e) {
    var b = e.target.closest("[data-st]");
    if (b) { state.st = b.getAttribute("data-st"); filtersChanged(); }
  });
  document.getElementById("rootChips").addEventListener("click", function (e) {
    var b = e.target.closest("[data-rf]");
    if (b) setFolderFilter(b.getAttribute("data-rf"), state.pf);
  });
  document.getElementById("projSel").addEventListener("change", function () { setFolderFilter(state.rf, this.value); });
  document.getElementById("expandAll").addEventListener("click", function () { setAll(true); });
  document.getElementById("collapseAll").addEventListener("click", function () { setAll(false); });
  function clearFilters() {
    filterEl.value = "";
    state.filter = "";
    state.st = "all";
    qOpen = {};
    setFolderFilter("", "");
  }
  document.getElementById("clearF").addEventListener("click", clearFilters);
  document.getElementById("headlessT").addEventListener("change", function () {
    state.headless = this.checked;
    try { localStorage.setItem("agent-cost-show-headless", state.headless ? "1" : "0"); } catch (e) {}
    filtersChanged();
  });

  function setupTheme() {
    var btn = document.getElementById("themeToggle");
    var root = document.documentElement;
    var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    var saved = null;
    try { saved = localStorage.getItem("agent-cost-theme"); } catch (e) {}
    if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved);
    function isDark() {
      var t = root.getAttribute("data-theme");
      return t ? t === "dark" : !!(mq && mq.matches);
    }
    function paint() {
      var d = isDark();
      btn.innerHTML = d ? ICON.sun : ICON.moon;
      btn.setAttribute("aria-label", d ? "Switch to light theme" : "Switch to dark theme");
      btn.title = btn.getAttribute("aria-label");
    }
    btn.addEventListener("click", function () {
      var next = isDark() ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("agent-cost-theme", next); } catch (e) {}
      paint();
    });
    if (mq && mq.addEventListener) mq.addEventListener("change", paint);
    paint();
  }

  function reload(data) {
    var prev = state.root && state.root.id;
    var sy = window.scrollY, ss = slist.scrollTop;
    var tls = document.querySelector(".tl-scroll"), tlx = tls ? tls.scrollLeft : 0;
    var ae = document.activeElement;
    var akey = ae && ae.classList && ae.classList.contains("tl-row") ? ae.getAttribute("data-key") : null;
    if (!load(data)) { state.root = null; return; }
    var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    var r = (prev && (byRoot[prev] || bySession[prev])) || byRoot[h] || bySession[h] || byRoot[focusId] || roots[0];
    if (!r) return;
    var moved = state.root && r.id !== prev;
    state.root = r;
    if (moved && prev && bySession[prev] && !byRoot[prev]) state.sel = state.sel || "s:" + prev;
    render();
    window.scrollTo(0, sy);
    slist.scrollTop = ss;
    tls = document.querySelector(".tl-scroll");
    if (tls) tls.scrollLeft = tlx;
    if (akey) {
      var el = main.querySelector('.tl-row[data-key="' + (window.CSS && CSS.escape ? CSS.escape(akey) : akey) + '"]');
      if (el) el.focus({ preventScroll: true });
    }
  }

  var liveVersion = null, liveTimer = null, liveBusy = false, liveAt = null;
  var tsfmt = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  function setLive(ok) {
    var ind = document.getElementById("liveInd");
    ind.hidden = false;
    ind.classList.toggle("off", !ok);
    document.getElementById("liveTxt").textContent = ok ? "live · updated " + tsfmt.format(liveAt || Date.now()) : "offline";
    ind.title = ok ? "Updates by itself when the data changes" : "The agent-cost server is not reachable; run agent-cost serve";
  }
  function getJSON(url) {
    return fetch(url, { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error(url + " " + res.status);
      return res.json();
    });
  }
  var rawRoots = null;
  function merge(data) {
    if (!data.incremental || !rawRoots) rawRoots = {};
    (data.roots || []).forEach(function (x) { rawRoots[x.root_session_id] = x; });
    (data.removed || []).forEach(function (id) { delete rawRoots[id]; });
    return { generated_at: data.generated_at, focus_root_session_id: data.focus_root_session_id, project_roots: data.project_roots,
      visible_roots: data.visible_roots, roots: Object.keys(rawRoots).map(function (k) { return rawRoots[k]; }) };
  }
  function fetchData(first) {
    var url = first || !liveVersion || !rawRoots ? "/api/data" : "/api/data?since=" + encodeURIComponent(liveVersion);
    return getJSON(url).then(function (data) {
      var changed = !data.incremental || (data.roots || []).length || (data.removed || []).length;
      var merged = merge(data);
      liveVersion = data.version || null;
      liveAt = Date.now();
      if (first) { if (load(merged)) route(); } else if (changed) reload(merged);
      setLive(true);
    });
  }
  function schedule(ms) {
    clearTimeout(liveTimer);
    liveTimer = setTimeout(poll, ms == null ? 3000 : ms);
  }
  function poll() {
    if (document.hidden) return;
    if (liveBusy) return schedule();
    liveBusy = true;
    var first = !roots.length;
    getJSON("/api/version").then(function (v) {
      if (first || v.version !== liveVersion) return fetchData(first);
      setLive(true);
    }).catch(function () { setLive(false); }).then(function () { liveBusy = false; schedule(); });
  }

  setupTheme();
  window.addEventListener("hashchange", route);
  if (LIVE) {
    main.innerHTML = '<div class="empty card">Loading…</div>';
    document.addEventListener("visibilitychange", function () { if (!document.hidden) schedule(0); });
    liveBusy = true;
    fetchData(true).catch(function () { showEmpty(); setLive(false); }).then(function () { liveBusy = false; schedule(); });
  } else if (load(DATA)) {
    route();
  }
})();
</script>
</body>
</html>
